syntax = "proto3";

package billiard;

message CreateSessionRequest {
  string player_name = 1;
}

message CreateSessionResponse {
  uint32 session_id = 1;
  uint32 client_id = 2;
  bool success = 3;
  string error_message = 4;
}

message JoinSessionRequest {
  uint32 session_id = 1;
  string player_name = 2;
}

message JoinSessionResponse {
  uint32 session_id = 1;
  uint32 client_id = 2;
  bool success = 3;
  string error_message = 4;
}

message BallState {
  int32 ball_number = 1;
  float pos_x = 2;
  float pos_y = 3;
  float vel_x = 4;
  float vel_y = 5;
  float angular_speed = 6;
  bool is_on_table = 7;
  float spin_omega_x = 8;
  float spin_omega_y = 9;
  float spin_omega_z = 10;
}

message TableSnapshotMsg {
  repeated BallState balls = 1;
}

message RulesSnapshotMsg {
  int32 phase = 1;
  int32 active_player = 2;
  bool is_ball_in_hand = 3;
  bool is_break_shot = 4;
  repeated int32 player_ball_types = 5;
  repeated int32 pocketed_solids = 6;
  repeated int32 pocketed_stripes = 7;
  bool is_game_over = 8;
  int32 winner_index = 9;
}

message GameStartedMsg {
  uint32 session_id = 1;
  int32 your_player_index = 2;
}

message CueAimUpdateMsg {
  uint32 turn_id = 1;
  int32 player_index = 2;
  float direction_angle_rad = 3;
  float pull_distance = 4;
  float lateral_spin = 5;
  float vertical_spin = 6;
}

message TableStateUpdateMsg {
  uint32 turn_id = 1;
  int32 player_index = 2;
  TableSnapshotMsg table = 3;
}

message TurnStartedMsg {
  uint32 turn_id = 1;
  int32 active_player = 2;
  TableSnapshotMsg table = 3;
}

message TurnResultMsg {
  uint32 turn_id = 1;
  TableSnapshotMsg table = 2;
  int32 next_active_player = 3;
  RulesSnapshotMsg rules = 4;
}

message SubmitTurnIntentMsg {
  uint32 turn_id = 1;
  int32 player_index = 2;
  float direction_angle_rad = 3;
  float pull_distance = 4;
  float lateral_spin = 5;
  float vertical_spin = 6;
}

message Envelope {
  oneof payload {
    CreateSessionRequest create_session_request = 1;
    CreateSessionResponse create_session_response = 2;
    JoinSessionRequest join_session_request = 3;
    JoinSessionResponse join_session_response = 4;
    TurnStartedMsg turn_started = 5;
    TurnResultMsg turn_result = 6;
    SubmitTurnIntentMsg submit_turn_intent = 7;
    GameStartedMsg game_started = 8;
    CueAimUpdateMsg cue_aim_update = 9;
    TableStateUpdateMsg table_state_update = 10;
  }
}
